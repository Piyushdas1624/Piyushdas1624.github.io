<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Piyush Das</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="style.css">

            <h1 class="gradient-text" style="font-size: 5rem; margin-bottom: 1rem;">404</h1>

    <footer class="footer">
        <div class="container">
            <p><strong>Built with:</strong> HTML, CSS, JavaScript • Hosted on GitHub Pages • Source on <a href="https://github.com/Piyushdas1624/Piyushdas1624.github.io" target="_blank" rel="noopener" style="color: #a5b4fc;">GitHub</a></p>
